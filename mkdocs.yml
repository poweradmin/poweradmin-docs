site_name: Poweradmin Documentation
site_url: https://docs.poweradmin.org
site_description: Documentation for Poweradmin - PowerDNS Web Administration Tool

repo_url: https://github.com/poweradmin/poweradmin-docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: img/logo.png
  favicon: img/favicon.ico
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
  # A neutral header with the brand red as the accent, which is how
  # poweradmin.org itself uses #cc0000. Exact shades are in docs/css/extra.css.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - css/extra.css

# superfences renders code fences nested in lists, which the default fenced_code extension breaks
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

validation:
  # Every page under docs/ is expected to be reachable from the nav; under
  # --strict these warnings become build failures.
  nav:
    omitted_files: warn
    not_found: warn
  links:
    absolute_links: relative_to_docs
    anchors: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/overview.md
      - Features: getting-started/features.md
      - Quick Evaluation:
          - Docker Demo: getting-started/docker-demo.md
          - Headless / API-First Quickstart: getting-started/headless-quickstart.md
      - First Steps: getting-started/first-steps.md
      - System Requirements: getting-started/requirements.md

  - What's New:
      - Overview: whats-new/index.md
      - v4.5.0: whats-new/v4.5.0.md
      - v4.4.0: whats-new/v4.4.0.md
      - v4.3.0: whats-new/v4.3.0.md
      - v4.2.0: whats-new/v4.2.0.md
      - v4.1.0: whats-new/v4.1.0.md
