version: 2

updates:
  # The workflows pin actions to commit SHAs; Dependabot keeps the SHA and the
  # trailing "# vX.Y.Z" comment in step.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Vilnius
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci

  # The pinned MkDocs toolchain in requirements.txt.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Vilnius
    cooldown:
      default-days: 7
    groups:
      mkdocs-toolchain:
        patterns:
          - "*"
    commit-message:
      prefix: ci
