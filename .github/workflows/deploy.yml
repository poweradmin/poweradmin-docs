name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

permissions:
  contents: read

# Deploys force-push to the published site, so queue them rather than
# running two at once. Never cancel a deploy that is already pushing.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  # Pushes land on main directly, so the lint in validate.yml never sees them.
  # Gate the deploy on it here instead.
  lint:
    name: Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A code fence that is not indented by four spaces renders as a sibling of
      # the list instead of inside the item it belongs to.
      - name: Check fences inside ordered lists
        run: |
          # Capture first: the exit status of a pipeline is tr's, which is always 0.
          hits=$(grep -rPzoH '(?m)^\d+\.[^\n]*\n\n```' docs --include='*.md' | tr '\0' '\n' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Indent these fences by four spaces so they stay inside the list item."
            exit 1
          fi

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: 'docs/**/*.md'

  deploy:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout docs repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout target repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: poweradmin/poweradmin.github.io
          path: poweradmin.github.io
          token: ${{ secrets.DEPLOY_TOKEN }}

      # The class reference is generated, not committed: Doctum renders lib/ from the
      # master branch into docs/reference, and mkdocs copies it to the site verbatim.
      - name: Checkout poweradmin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: poweradmin/poweradmin
          ref: master
          path: poweradmin

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'

      - name: Build the class reference
        working-directory: poweradmin
        env:
          DOCTUM_BUILD_DIR: ${{ github.workspace }}/docs/reference
          DOCTUM_CACHE_DIR: ${{ runner.temp }}/doctum-cache
        run: |
          composer doctum:install
          php .doctum/doctum.phar update doctum.php --ignore-parse-errors --no-progress
          test -f "$DOCTUM_BUILD_DIR/index.html"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Engine-independent copy of validation.nav, which Zensical does not enforce.
      - name: Check every page is in the nav
        run: python scripts/check_nav.py

      # Build once more before deploying, so raw-HTML paths that --strict cannot see are
      # checked here too; pushes to main do not go through validate.yml.
      - name: Check local paths in the built site
        run: |
          mkdocs build --strict --site-dir /tmp/site-check
          python scripts/check_site_paths.py /tmp/site-check

      - name: Build and deploy
        run: |
          cd poweradmin.github.io
          mkdocs gh-deploy --strict --verbose --config-file ../mkdocs.yml --remote-branch master --force
