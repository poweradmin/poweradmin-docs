name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout docs repo
        uses: actions/checkout@v4

      - name: Reject MkDocs admonitions
        run: |
          if grep -rn --include='*.md' '^[[:space:]]*!!!' docs/; then
            echo "::error::MkDocs admonitions are not supported here. The admonition extension is not enabled, so the marker line renders as visible text and any indented paragraph below it becomes a code block. Use a blockquote callout instead: > **Note:** text"
            exit 1
          fi

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: poweradmin/poweradmin.github.io
          path: poweradmin.github.io
          token: ${{ secrets.DEPLOY_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install mkdocs mkdocs-glightbox pymdown-extensions

      - name: Build and deploy
        run: |
          cd poweradmin.github.io
          mkdocs gh-deploy --verbose --config-file ../mkdocs.yml --remote-branch master --force
