name: Validate Documentation

# main is covered by the strict build in deploy.yml; this catches problems
# before they get there.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Engine-independent copy of validation.nav, which Zensical does not enforce.
      - name: Check every page is in the nav
        run: python scripts/check_nav.py

      - name: Build
        run: mkdocs build --strict

      - name: Upload site for preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/
          retention-days: 7

  lint:
    name: Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A code fence that is not indented by four spaces renders as a sibling of
      # the list instead of inside the item it belongs to.
      - name: Check fences inside ordered lists
        run: |
          # Capture first: the exit status of a pipeline is tr's, which is always 0.
          hits=$(grep -rPzoH '(?m)^\d+\.[^\n]*\n\n```' docs --include='*.md' | tr '\0' '\n' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Indent these fences by four spaces so they stay inside the list item."
            exit 1
          fi

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: 'docs/**/*.md'
